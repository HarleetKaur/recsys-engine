# Redis + Triton + the API. Run the pipeline (including export_triton) first so artifacts/ and
# triton/model_repository exist. The Triton image has to ship the same TensorFlow version that trained
# the rankers - set TRITON_TAG to a matching release (see triton/model_repository/EXPORT_INFO.json).
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  triton:
    image: nvcr.io/nvidia/tritonserver:${TRITON_TAG:-24.05-tf2-py3}
    command: tritonserver --model-repository=/models
    volumes: ["./triton/model_repository:/models"]
    ports: ["8000:8000", "8001:8001", "8002:8002"]
  api:
    build: .
    environment:
      RECSYS_HOME: /app
      RECSYS_CONFIG: /app/configs/config.yaml
      PYTHONPATH: /app/src
    volumes: ["./artifacts:/app/artifacts", "./data:/app/data", "./logs:/app/logs", "./configs:/app/configs"]
    ports: ["8080:8080"]
    depends_on: [redis, triton]
